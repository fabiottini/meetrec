name: windows

# Windows: meet.py end to end (whisper.cpp for Windows, ffmpeg, UTF-8 notes), the recorder with
# synthetic audio, the tray app self test from the unzipped package. On a tag vX.Y.Z the package
# is attached to the GitHub release as MeetRec-windows.zip (created by `make tag`).
# Actions are pinned to commit SHAs (the comment says the version).

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Tools - ffmpeg, whisper.cpp (Windows build), models
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python windows/ci_ffmpeg.py
          python -c @"
          import json, os, urllib.request, zipfile, pathlib
          h = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'User-Agent': 'meetrec-ci'}
          req = urllib.request.Request('https://api.github.com/repos/ggml-org/whisper.cpp/releases?per_page=20', headers=h)
          rels = json.load(urllib.request.urlopen(req))
          rel = next(r for r in rels if any(a['name'] == 'whisper-bin-x64.zip' for a in r['assets']))
          url = next(a['browser_download_url'] for a in rel['assets'] if a['name'] == 'whisper-bin-x64.zip')
          print('whisper.cpp release', rel['tag_name'])
          urllib.request.urlretrieve(url, 'whisper.zip')
          zipfile.ZipFile('whisper.zip').extractall('whisper')
          cli = next(pathlib.Path('whisper').rglob('whisper-cli.exe'))
          open(os.environ['GITHUB_ENV'], 'a').write(f'WHISPER={cli.resolve()}\n')
          os.makedirs('models', exist_ok=True)
          for u in ['https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin',
                    'https://huggingface.co/ggml-org/whisper-vad/resolve/main/ggml-silero-v6.2.0.bin']:
              urllib.request.urlretrieve(u, 'models/' + u.rsplit('/', 1)[1])
          "@

      - name: Test audio from Windows speech synthesis
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Speech
          $s = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $s.SetOutputToWaveFile("$PWD\call.wav")
          $s.Speak("Let's start with the release. We are ready for Thursday. The budget stays the same.")
          $s.Dispose()

      - name: meet.py end to end
        shell: pwsh
        run: |
          ffmpeg -version | Select-Object -First 1
          & $env:WHISPER --help 2>&1 | Select-Object -First 1
          python scripts/test_core.py call.wav --whisper "$env:WHISPER" --model models/ggml-tiny.bin --vad models/ggml-silero-v6.2.0.bin --word release

  recorder:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Build meetrec-capture.exe
        shell: pwsh
        run: |
          dotnet publish windows/capture/MeetRecCapture.csproj -c Release -o out
          Get-Item out/meetrec-capture.exe | Select-Object Name, Length

      - name: List microphones (the runner may have none)
        shell: pwsh
        run: |
          & ./out/meetrec-capture.exe --list-mics
          "exit $LASTEXITCODE"

      - name: ffmpeg (same download as the app setup)
        shell: pwsh
        run: python windows/ci_ffmpeg.py

      - name: Synthetic recording through the real writer and stop protocol
        shell: pwsh
        run: python scripts/test_recorder.py out/meetrec-capture.exe

  app:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Build the tray app (recorder included)
        shell: pwsh
        run: dotnet publish windows/app/MeetRec.csproj -c Release -o pub/app

      - name: No known vulnerable NuGet packages (direct and transitive)
        shell: pwsh
        run: |
          $out = dotnet list windows/app/MeetRec.csproj package --vulnerable --include-transitive 2>&1 | Out-String
          $out
          if ($out -match 'has the following vulnerable packages') { exit 1 }

      - name: Package MeetRec-windows.zip
        shell: pwsh
        run: |
          python windows/ci_ffmpeg.py
          python windows/package.py pub/app dist-win

      - name: Self test from the unzipped package, images of the UI
        shell: pwsh
        run: python windows/test_app.py dist-win/MeetRec-windows.zip ui

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: MeetRec-windows
          path: |
            dist-win/MeetRec-windows.zip
            ui/*.png

  release:
    # on branches it only checks that the package is where the upload expects it
    needs: [core, recorder, app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: MeetRec-windows
      - name: Package present
        run: ls -l dist-win/MeetRec-windows.zip
      - name: Attach MeetRec-windows.zip to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # `make tag` pushes the tag and then creates the release: wait for it
          for i in $(seq 1 60); do gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 && break; sleep 10; done
          gh release upload "$TAG" dist-win/MeetRec-windows.zip -R "$GITHUB_REPOSITORY" --clobber
